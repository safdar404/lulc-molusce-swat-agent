[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lulc-molusce-swat-agent"
version = "0.4.2"
description = "AI-assisted research tools for LULC change detection, MOLUSCE validation and SWAT+ evaluation (Streamlit app)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "rasterio>=1.3", "anthropic>=0.40", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

# Flat layout: every module sits in the repository root (GitHub web upload cannot create folders).
[tool.setuptools]
py-modules = ["agent", "agent_tools", "app", "hydro", "knowledge", "metrics", "rasterops", "session", "store", "ui"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 240
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
