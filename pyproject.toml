[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lulc-molusce-swat-agent"
version = "0.7.0"
description = "AI-assisted research tools for LULC change detection, MOLUSCE validation and SWAT+ evaluation (Streamlit app)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "rasterio>=1.3", "anthropic>=0.40", "streamlit>=1.35", "matplotlib>=3.7", "altair>=5", "openpyxl>=3.1", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

# Flat layout: every module sits in the repository root (GitHub web upload cannot create folders).
[tool.setuptools]
py-modules = ["advanced_tabs", "agent", "agent_tools", "app", "canvas_tab", "cartography", "changeops", "hotspot", "intensity", "landscape", "live", "hydro", "knowledge", "metrics", "olofsson", "pattern_tab", "patternops", "rasterops", "session", "store", "ui"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 240
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
